name: Build e imagens Docker

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE_VERSION: 1.${{ github.run_number }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Compilar solução
        run: dotnet build ConexaoSolidaria.slnx --configuration Release

      - name: Gerar imagens Docker
        run: |
          docker build --file Api/Dockerfile --tag "conexaosolidaria-api:${IMAGE_VERSION}" .
          docker build --file Worker/Dockerfile --tag "conexaosolidaria-worker:${IMAGE_VERSION}" .
          docker save --output "conexaosolidaria-api-${IMAGE_VERSION}.tar" "conexaosolidaria-api:${IMAGE_VERSION}"
          docker save --output "conexaosolidaria-worker-${IMAGE_VERSION}.tar" "conexaosolidaria-worker:${IMAGE_VERSION}"

      - name: Disponibilizar imagem da API
        uses: actions/upload-artifact@v4
        with:
          name: conexaosolidaria-api-${{ env.IMAGE_VERSION }}
          path: conexaosolidaria-api-${{ env.IMAGE_VERSION }}.tar
          if-no-files-found: error

      - name: Disponibilizar imagem do Worker
        uses: actions/upload-artifact@v4
        with:
          name: conexaosolidaria-worker-${{ env.IMAGE_VERSION }}
          path: conexaosolidaria-worker-${{ env.IMAGE_VERSION }}.tar
          if-no-files-found: error
