services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: conexaosolidaria
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conexaosolidaria-local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d conexaosolidaria']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
