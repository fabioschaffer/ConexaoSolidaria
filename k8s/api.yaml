apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: aguardar-postgres
          image: postgres:17
          command: [sh, -c, 'until pg_isready -h postgres -U postgres -d conexaosolidaria; do sleep 3; done']
      containers:
        - name: api
          image: conexaosolidaria-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: conexaosolidaria
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: postgres-password
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: rabbitmq-password
            - name: ConnectionStrings__ConexaoSolidaria
              value: Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)
            - name: Jwt__Chave
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: jwt-key
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
