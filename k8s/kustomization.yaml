apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: conexaosolidaria
resources:
  - configuracao.yaml
  - secrets.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - api.yaml
  - worker.yaml
  - observabilidade.yaml
configMapGenerator:
  - name: postgres-init
    files:
      - iniciar-postgres.sql
  - name: configurar-observabilidade
    files:
      - configurar-observabilidade.cs
