apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
spec:
  selector:
    app: zabbix-server
  ports:
    - port: 10051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
          env:
            - name: DB_SERVER_HOST
              value: postgres
            - name: POSTGRES_DB
              value: zabbix
            - name: POSTGRES_USER
              value: zabbix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: zabbix-db-password
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
spec:
  selector:
    app: zabbix-web
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
spec:
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
          env:
            - name: DB_SERVER_HOST
              value: postgres
            - name: POSTGRES_DB
              value: zabbix
            - name: POSTGRES_USER
              value: zabbix
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: zabbix-db-password
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: PHP_TZ
              value: America/Sao_Paulo
          readinessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.3.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: grafana-admin-password
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          volumeMounts:
            - name: dados
              mountPath: /var/lib/grafana
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: batch/v1
kind: Job
metadata:
  name: configurar-observabilidade
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: aguardar-api
          image: busybox:1.37
          command: [sh, -c, 'until wget -q -T 5 -O /dev/null http://api:8080/health; do sleep 3; done']
      containers:
        - name: configurar
          image: mcr.microsoft.com/dotnet/sdk:10.0
          command: [dotnet, run, --file, /app/configurar-observabilidade.cs]
          envFrom:
            - configMapRef:
                name: conexaosolidaria
          env:
            - name: GRAFANA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: grafana-admin-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: postgres-password
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: rabbitmq-password
            - name: RABBITMQ_USER
              value: $(RabbitMq__UserName)
            - name: RABBITMQ_QUEUE
              value: $(RabbitMq__FilaDoacoesRecebidas)
          volumeMounts:
            - name: script
              mountPath: /app/configurar-observabilidade.cs
              subPath: configurar-observabilidade.cs
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: configurar-observabilidade
