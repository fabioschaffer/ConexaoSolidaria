apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          envFrom:
            - configMapRef:
                name: conexaosolidaria
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: postgres-password
            - name: ZABBIX_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conexaosolidaria
                  key: zabbix-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
            - name: inicializacao
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: inicializacao
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
